backend:
  name: github
  repo: bgy8023/qiyuan-blog-template
  branch: main
  base_url: https://api-blog.mars1024.com
  auth_endpoint: auth

media_folder: "public/img"
public_folder: "/img"

locale: "zh_Hant"

collections:
  # ==========================================
  # 1. 博客文章管理
  # ==========================================
  - name: "blog"
    label: "📝 博客文章 (Blog Posts)"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "文章描述/摘要", name: "description", widget: "string" }
      - { label: "发布时间", name: "pubDate", widget: "datetime", format: "MMM DD YYYY HH:mm", date_format: "MMM DD YYYY", time_format: "HH:mm" }
      - { label: "封面图片", name: "heroImage", widget: "image", required: false }
      - { label: "分类", name: "categories", widget: "list", default: ["随笔"] }
      - { label: "标签", name: "tags", widget: "list", default: ["博客"] }
      - { label: "置顶权重", name: "pin", widget: "number", value_type: "int", required: false }
      - { label: "开启语音朗读", name: "audio", widget: "boolean", default: false, required: false }
      - { label: "文章正文", name: "body", widget: "markdown" }

  # ==========================================
  # 2. 网站功能与设置面板
  # ==========================================
  - name: "settings"
    label: "⚙️ 网站全功能与设置 (Site Settings)"
    delete: false
    editor:
      preview: false
    files:
      - name: "site_config"
        label: "全局设置与模块开关"
        file: "config/site.yaml"
        fields:
          # --- 基础属性 ---
          - label: "📌 站点核心属性"
            name: "site"
            widget: "object"
            fields:
              - { label: "网站主标题", name: "title", widget: "string" }
              - { label: "副标缩写/英文名", name: "alternate", widget: "string" }
              - { label: "网站副标题", name: "subtitle", widget: "string" }
              - { label: "站长昵称", name: "author", widget: "string" }
              - { label: "SEO 描述", name: "description", widget: "text" }
              - { label: "博客域名", name: "url", widget: "string" }
              - { label: "建站年份", name: "startYear", widget: "number", value_type: "int" }

          # --- 社交账号 ---
          - label: "🌐 社交媒体链接"
            name: "social"
            widget: "object"
            fields:
              - label: "GitHub 主页"
                name: "github"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string" }
              - label: "联系邮箱"
                name: "email"
                widget: "object"
                fields:
                  - { label: "Mailto 地址", name: "url", widget: "string" }
              - label: "Telegram 频道/账号"
                name: "telegram"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string" }
              - label: "X / Twitter"
                name: "twitter"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string" }

          # --- 评论系统 ---
          - label: "💬 评论系统集成"
            name: "comment"
            widget: "object"
            fields:
              - label: "评论服务商"
                name: "provider"
                widget: "select"
                options:
                  - { label: "关闭评论", value: "none" }
                  - { label: "Cloudflare KV 原生评论", value: "custom" }
                  - { label: "Giscus (GitHub Discussions)", value: "giscus" }
                  - { label: "Waline 评论", value: "waline" }
                  - { label: "Twikoo 评论", value: "twikoo" }
                default: "none"

          # --- AI 站内问答 ---
          - label: "🤖 AI 站内问答助手 (RAG)"
            name: "rag"
            widget: "object"
            fields:
              - { label: "开启全站 AI 助手", name: "enabled", widget: "boolean", default: false }
              - { label: "召回参考条数 (Top K)", name: "topK", widget: "number", value_type: "int", default: 5 }

          # --- 临时邮箱功能 ---
          - label: "📬 临时邮箱服务"
            name: "tempMail"
            widget: "object"
            fields:
              - { label: "开启临时邮箱功能", name: "enabled", widget: "boolean", default: false }

          # --- 资源站分享 ---
          - label: "📦 资源站导航与页面"
            name: "resources"
            widget: "object"
            fields:
              - { label: "开启资源站", name: "enabled", widget: "boolean", default: false }
              - { label: "导航栏名称", name: "label", widget: "string", default: "资源站" }

          # --- 背景音乐 ---
          - label: "🎵 背景音乐播放器"
            name: "bgm"
            widget: "object"
            fields:
              - { label: "开启音乐浮窗", name: "enabled", widget: "boolean", default: true }
              - { label: "Meting API 地址", name: "metingApi", widget: "string", default: "https://api.i-meto.com/meting/api" }

          # --- 全站动效 ---
          - label: "✨ 动效与视觉体验"
            name: "anime"
            widget: "object"
            fields:
              - { label: "开启全站动画效果", name: "enabled", widget: "boolean", default: true }
