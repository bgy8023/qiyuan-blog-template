<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mars1024 博客管理中心 - Content & Edge Manager</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    /* 悬浮常驻工具栏：保证在任何页面状态、任何层级下都绝对可见 */
    #edge-floating-bar {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 2147483647; /* 保证最高层级，不被 CMS 遮挡 */
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 4px 6px 4px 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .edge-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
    }
    .edge-badge-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
    .edge-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .edge-btn:hover {
      background: #0369a1;
    }

    /* 弹出控制台模态框 */
    #custom-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      z-index: 2147483646;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
      padding: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1e293b;
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .stat-val { font-size: 24px; font-weight: 700; color: #38bdf8; }
    
    .section-title { font-size: 15px; font-weight: 600; margin: 20px 0 12px; color: #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    th { background: rgba(0, 0, 0, 0.2); color: #94a3b8; }
    
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-item label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .form-item input, .form-item select {
      width: 100%;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: white;
      font-size: 13px;
      outline: none;
    }
    .btn-save {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-del {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-del:hover { background: #ef4444; color: white; }
  </style>
</head>
<body>
  <!-- 右上角悬浮常驻条 (固定于屏幕右上角，哪怕未登录也始终可见) -->
  <div id="edge-floating-bar">
    <div class="edge-badge">
      <span class="edge-badge-dot"></span>
      <span>D1 Edge Active</span>
    </div>
    <button class="edge-btn" onclick="openEdgeModal()">
      <span>📊</span> <span>实时数据与热配置</span>
    </button>
  </div>

  <!-- 核心 Decap CMS 引擎 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 边缘运行中心模态框 -->
  <div id="custom-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div style="font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px;">
          <span>⚡ Cloudflare D1 边缘运行中心</span>
          <span style="font-size: 11px; background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px;">Live Mode</span>
        </div>
        <button class="close-btn" onclick="closeEdgeModal()">✕</button>
      </div>

      <!-- 实时指标 -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">全站总阅读量 (Views)</div>
          <div class="stat-val" id="m-views">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">文章总点赞 (Likes)</div>
          <div class="stat-val" id="m-likes">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">交互评论数 (Comments)</div>
          <div class="stat-val" id="m-comments">-</div>
        </div>
      </div>

      <!-- D1 秒级热配置 -->
      <div class="section-title">⚙️ 秒级边缘热配置 (无需重新构建)</div>
      <form onsubmit="saveModalSettings(event)">
        <div class="form-row">
          <div class="form-item">
            <label>前台站点标题 (Site Title)</label>
            <input type="text" id="m-cfg-title" />
          </div>
          <div class="form-item">
            <label>站长昵称 (Author)</label>
            <input type="text" id="m-cfg-author" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>AI 站内助手开关 (RAG Agent)</label>
            <select id="m-cfg-rag">
              <option value="true">开启 (True)</option>
              <option value="false">关闭 (False)</option>
            </select>
          </div>
          <div class="form-item" style="display:flex; align-items:flex-end;">
            <button type="submit" class="btn-save">立即保存至 D1</button>
            <span id="m-save-tip" style="margin-left: 12px; font-size: 12px; color: #10b981;"></span>
          </div>
        </div>
      </form>

      <!-- 评论即时审核 -->
      <div class="section-title">💬 最新访客评论管理</div>
      <table>
        <thead>
          <tr><th>作者</th><th>内容</th><th>发布时间</th><th>操作</th></tr>
        </thead>
        <tbody id="m-comments-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    function openEdgeModal() {
      document.getElementById('custom-modal').style.display = 'flex';
      loadDashboardModal();
    }

    function closeEdgeModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }

    async function loadDashboardModal() {
      try {
        const res = await fetch('/api/admin/dashboard');
        const data = await res.json();

        document.getElementById('m-views').textContent = data.stats.total_views || 0;
        document.getElementById('m-likes').textContent = data.stats.total_likes || 0;
        document.getElementById('m-comments').textContent = data.stats.total_comments || 0;

        const cfg = data.live_settings || {};
        document.getElementById('m-cfg-title').value = cfg.site_title || '';
        document.getElementById('m-cfg-author').value = cfg.author || '';
        document.getElementById('m-cfg-rag').value = cfg.rag_enabled ? 'true' : 'false';

        const tbody = document.getElementById('m-comments-tbody');
        tbody.innerHTML = (data.recent_comments || []).map(c => `
          <tr>
            <td><strong>` + c.author + `</strong></td>
            <td>` + c.content + `</td>
            <td>` + new Date(c.created_at).toLocaleString() + `</td>
            <td><button class="btn-del" onclick="deleteModalComment(` + c.id + `)">删除</button></td>
          </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;">暂无评论</td></tr>';
      } catch(e) { console.error(e); }
    }

    async function saveModalSettings(e) {
      e.preventDefault();
      const body = {
        site_title: document.getElementById('m-cfg-title').value,
        author: document.getElementById('m-cfg-author').value,
        rag_enabled: document.getElementById('m-cfg-rag').value === 'true'
      };
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      const tip = document.getElementById('m-save-tip');
      tip.textContent = '✓ ' + (data.message || '已同步！');
      setTimeout(() => tip.textContent = '', 3000);
    }

    async function deleteModalComment(id) {
      if (!confirm('确定彻底删除该评论？')) return;
      await fetch('/api/admin/comment-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status: 'delete' })
      });
      loadDashboardModal();
    }
  </script>
</body>
</html>
