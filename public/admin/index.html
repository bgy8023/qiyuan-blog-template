<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mars1024 博客管理中心 - Control Center</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
    }
    .top-bar {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand { font-size: 16px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .nav-tabs { display: flex; gap: 12px; }
    .tab-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    .view-container { padding: 24px; max-width: 1200px; margin: 0 auto; display: none; }
    .view-container.active { display: block; }
    
    /* 统计卡片网格 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .card-title { font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
    .card-value { font-size: 28px; font-weight: 700; color: #38bdf8; }
    
    /* 数据表格与列表 */
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    th { color: #94a3b8; font-weight: 600; background: rgba(0, 0, 0, 0.2); }
    .btn-action {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    /* 快速热配置表单 */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #decap-cms-wrapper {
      min-height: calc(100vh - 60px);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <span>🚀 Mars1024 Blog Admin</span>
      <span style="font-size: 11px; background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px;">D1 + Worker</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('dashboard')">📊 实时仪表盘</button>
      <button class="tab-btn" onclick="switchTab('live-config')">⚡ 边缘秒级配置</button>
      <button class="tab-btn" onclick="switchTab('cms')">📝 文章与静态内容 (Decap CMS)</button>
      <a href="https://mars1024.com" target="_blank" class="tab-btn" style="text-decoration:none;">🌐 前台首页</a>
    </div>
  </div>

  <!-- 视图 1：实时仪表盘 -->
  <div id="view-dashboard" class="view-container active">
    <div class="stats-grid">
      <div class="card">
        <div class="card-title">全站累计阅读量 (Views)</div>
        <div id="stat-views" class="card-value">-</div>
      </div>
      <div class="card">
        <div class="card-title">全站累计点赞数 (Likes)</div>
        <div id="stat-likes" class="card-value">-</div>
      </div>
      <div class="card">
        <div class="card-title">互动评论总数 (Comments)</div>
        <div id="stat-comments" class="card-value">-</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="card">
        <div class="card-title">🔥 热门文章阅读榜单</div>
        <table id="table-top-posts">
          <thead>
            <tr><th>文章路径 (Slug)</th><th>阅读</th><th>点赞</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="card">
        <div class="card-title">💬 最新评论与快速审核</div>
        <table id="table-recent-comments">
          <thead>
            <tr><th>作者</th><th>内容</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 视图 2：边缘秒级配置 -->
  <div id="view-live-config" class="view-container">
    <div class="card" style="max-width: 600px;">
      <h3 style="margin-top:0; color:#38bdf8;">⚡ Cloudflare D1 秒级热配置</h3>
      <p style="font-size:13px; color:#94a3b8;">在此修改的值存放在边缘 D1 中，提交后前台毫秒级热更新生效，完全跳过构建流水线！</p>
      <form id="d1-settings-form" onsubmit="saveLiveSettings(event)">
        <div class="form-group">
          <label>博客前台网站标题 (Site Title)</label>
          <input type="text" id="cfg-site-title" class="form-control" />
        </div>
        <div class="form-group">
          <label>站长昵称 (Author)</label>
          <input type="text" id="cfg-author" class="form-control" />
        </div>
        <div class="form-group">
          <label>AI 站内助手开关 (RAG Agent)</label>
          <select id="cfg-rag-enabled" class="form-control">
            <option value="true">开启 (True)</option>
            <option value="false">关闭 (False)</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">保存并立即同步至全球边缘节点</button>
        <span id="save-tip" style="margin-left: 12px; font-size: 13px; color: #4ade80;"></span>
      </form>
    </div>
  </div>

  <!-- 视图 3：Decap CMS 文章编辑系统 -->
  <div id="view-cms" class="view-container" style="padding:0; max-width:100%;">
    <div id="decap-cms-wrapper"></div>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('view-' + tabId).classList.add('active');

      if (tabId === 'dashboard') loadDashboardData();
      if (tabId === 'live-config') loadSettingsData();
    }

    async function loadDashboardData() {
      try {
        const res = await fetch('/api/admin/dashboard');
        const data = await res.json();
        
        document.getElementById('stat-views').textContent = data.stats.total_views || 0;
        document.getElementById('stat-likes').textContent = data.stats.total_likes || 0;
        document.getElementById('stat-comments').textContent = data.stats.total_comments || 0;

        // 填充文章
        const postTbody = document.querySelector('#table-top-posts tbody');
        postTbody.innerHTML = (data.top_posts || []).map(p => `
          <tr><td>${p.slug}</td><td>${p.views}</td><td>${p.likes}</td></tr>
        `).join('') || '<tr><td colspan="3" style="text-align:center;">暂无数据</td></tr>';

        // 填充评论
        const commentTbody = document.querySelector('#table-recent-comments tbody');
        commentTbody.innerHTML = (data.recent_comments || []).map(c => `
          <tr>
            <td>${c.author}</td>
            <td>${c.content}</td>
            <td><span style="color:#4ade80;">${c.status}</span></td>
            <td><button class="btn-action" onclick="deleteComment(${c.id})">删除</button></td>
          </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;">暂无评论</td></tr>';
      } catch(e) {
        console.error(e);
      }
    }

    async function deleteComment(id) {
      if (!confirm('确定删除该评论？')) return;
      await fetch('/api/admin/comment-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status: 'delete' })
      });
      loadDashboardData();
    }

    async function loadSettingsData() {
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        const cfg = data.settings || {};
        document.getElementById('cfg-site-title').value = cfg.site_title || '';
        document.getElementById('cfg-author').value = cfg.author || '';
        document.getElementById('cfg-rag-enabled').value = cfg.rag_enabled ? 'true' : 'false';
      } catch(e) { console.error(e); }
    }

    async function saveLiveSettings(e) {
      e.preventDefault();
      const body = {
        site_title: document.getElementById('cfg-site-title').value,
        author: document.getElementById('cfg-author').value,
        rag_enabled: document.getElementById('cfg-rag-enabled').value === 'true'
      };
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      const tip = document.getElementById('save-tip');
      tip.textContent = '✓ ' + (data.message || '更新成功！');
      setTimeout(() => tip.textContent = '', 3000);
    }

    // 初始化加载
    loadDashboardData();
  </script>
</body>
</html>
