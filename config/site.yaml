christmas:
  enabled: false
featuredSeries:
  - enabled: false
    categoryName: 周刊
    slug: weekly
    label: 我的周刊
    cover: /img/weekly_header.webp
    icon: ri:newspaper-line
    links:
      github: https://github.com/your-username
      rss: /rss.xml
    fullName: 我的技术周刊
    description: |
      这是周刊/系列文章功能的示例配置。
      你可以用它来发布定期更新的系列内容，如技术周刊、读书笔记系列等。
      设置 enabled: false 可以关闭此功能。
resources:
  enabled: false
  label: 资源站
  icon: ri:folder-download-line
  ownerUserId: 1
analytics:
  umami:
    enabled: false
    id: your-umami-id
    endpoint: https://stats.example.com
  pageviews:
    enabled: true
    article_page_views: true
    footer_site_stats: true
site:
  defaultOgImage: /img/avatar.svg
  showLogo: true
  keywords:
    - 博客
    - Astro
    - 技术
    - 前端
  author: mars
  name: 你的名字
  url: https://mars1024.com
  subtitle: 记录技术、写作与日常灵感。
  title: Mars博客
  avatar: /img/avatar.svg
  timezone: Asia/Shanghai
  alternate: mars
  description: 祈愿博客，记录技术、写作与日常灵感。
  startYear: 2026
bgm:
  enabled: true
  metingApi: https://api.i-meto.com/meting/api
  audio:
    - title: 我的歌单
      list:
        - https://music.example.com/your-playlist
featuredCategories:
  - link: life
    label: 随笔
    image: /img/cover/life.webp
    description: 生活记录、随想随笔
  - link: note
    label: 笔记
    image: /img/cover/note.webp
    description: 技术笔记、学习笔记
  - link: note/resources
    label: 资源
    image: /img/cover/resources.webp
    description: 网盘资源分享站，导航「资源站」可浏览全部
  - link: tools
    label: 工具
    image: /img/cover/tools.webp
    description: 工具使用、效率提升
social:
  github:
    url: https://github.com/your-username
    icon: ri:github-fill
    color: "#191717"
  email:
    url: mailto:your-email@example.com
    icon: ri:mail-line
    color: "#55acd5"
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: "#ff6600"
  telegram:
    url: https://t.me/your-handle
    icon: ri:telegram-fill
    color: "#229ED9"
  twitter:
    url: https://x.com/your-handle
    icon: ri:twitter-fill
    color: "#4b9ae4"
comment:
  provider: none
  twikoo:
    envId: https://your-twikoo.vercel.app
rag:
  enabled: false
  embedding:
    provider: siliconflow
    model: BAAI/bge-m3
    dims: 1024
  vectorDb:
    provider: neon
    table: rag_posts
  generation:
    provider: moonshot
    model: moonshot-v1-128k
  topK: 5
tempMail:
  enabled: false
  domains:
    - qiyuanmail.example.com
    - qiyuanmail.example.fr
    - qiyuanmail.example.ci
  domain: qiyuanmail.example.com
  retentionHours: 24
  label: 临时邮箱
  description: 免费临时邮箱，用于注册验证码等一次性场景，24 小时后自动销毁。
anime:
  enabled: true
  features:
    sakuraFall: true
    clickBurst: true
    cursorTrail: false
  sakura:
    intensity: 24
    mobileIntensity: 12
    speed: 1
navigation:
  - name: 首页
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  - name: 周刊
    nameKey: nav.weekly
    path: /weekly
    icon: ri:newspaper-line
  - name: 文章
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      - name: 分类
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: 标签
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: 归档
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: 关于
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user
  - name: 歌单
    nameKey: nav.music
    path: /music
    icon: ri:music-2-fill
  - name: 临时邮箱
    nameKey: nav.tempmail
    path: /temp-mail
    icon: ri:mail-send-line
    enabled: false
  - name: 网盘
    nameKey: nav.drive
    path: /drive
    icon: ri:hard-drive-3-line
    enabled: false
  - name: 短链
    nameKey: nav.shorten
    path: /shorten
    icon: ri:link
    enabled: false
dev:
  localProjectPath: C:/path/to/your-blog
  contentRelativePath: src/content/blog
  editors:
    - id: vscode
      name: VS Code
      icon: devicon-plain:vscode
      urlTemplate: vscode://file/{path}
    - id: cursor
      name: Cursor
      icon: simple-icons:cursor
      urlTemplate: cursor://file/{path}
    - id: zed
      name: Zed
      icon: simple-icons:zedindustries
      urlTemplate: zed://file/{path}
content:
  addHeadingLevel: true
  addBlankTarget: true
  enableCodeCopy: true
  previewCacheTime: 30
  enableShokaRuby: true
  enableTweetEmbed: true
  enableCodeFullscreen: true
  enableMath: true
  enableEncryptedBlock: true
  enableOGPreview: true
  enableCodePenEmbed: true
  enhanceCodeBlock: true
  postCardImagePosition: alternating
  lazyLoadEmbeds: true
  enableCodeMeta: true
  enableShokaEffects: true
  enableShokaAttrs: true
  enableShokaSpoiler: true
  enableQuiz: true
  enableShokaHexoTags: true
  smoothScroll: true
  enableLinkEmbed: true
  enableShokaContainers: true
seo:
  robots:
    sitemap:
      - sitemap-index.xml
i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文
    - code: en
      label: English
      enabled: true
    - code: ja
      label: 日本語
      enabled: true
categoryMap:
  随笔: life
  笔记: note
  工具: tools
  周刊: weekly
  资源: resources
